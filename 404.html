<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · A Tiempo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: swap; src: url("/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url("/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
:root { --paper: #f6f7f9; --ink: #131a26; --muted: #586273; --accent: #2f2ac4; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; padding: 24px 20px; }
main { max-width: 40ch; display: grid; gap: 14px; }
.code { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); margin: 0; }
h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: clamp(2rem, 7vw, 3rem); line-height: 1; letter-spacing: -.02em; margin: 0; }
p { margin: 0; color: var(--muted); }
a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Esta página no existe.</h1>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
  <a href="/">Volver a A Tiempo</a>
</main>
</body>
</html>
